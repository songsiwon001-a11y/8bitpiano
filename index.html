<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8Bit Piano & Drum Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { font-family: 'Press Start 2P', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .key-white { background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%); border: 2px solid #0f172a; border-radius: 0 0 6px 6px; box-shadow: 0 4px 0 #0f172a; }
        .key-white:active, .key-white.active { background: #38bdf8; transform: translateY(2px); box-shadow: 0 2px 0 #0f172a; }
        .key-black { background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%); border: 2px solid #000000; border-radius: 0 0 4px 4px; box-shadow: 0 3px 0 #000000; z-index: 10; }
        .key-black:active, .key-black.active { background: #f43f5e; transform: translateY(2px); box-shadow: 0 1px 0 #000000; }
        .drum-pad { transition: all 0.05s ease; }
        .drum-pad:active, .drum-pad.active { transform: scale(0.95); filter: brightness(1.3); }
    </style>
</head>

    </main>

    <footer class="p-3 bg-slate-900 border-t border-slate-800 text-center text-[9px] text-slate-500">

    </footer>

    <script>
        const BASE_FREQ_BASS = 12.5;
        const BASE_FREQ_PULSE = 26.0;

        let audioCtx = null;
        let masterGain = null;
        let recorderNode = null;
        let recordedBuffersLeft = [];
        let recordedBuffersRight = [];
        let isRecording = false;

        let bassBuffer = null;
        let pulseBuffer = null;
        let drumBuffer = null;

        let currentToneMode = 'bass';
        let currentOctave = 4;
        let isDemoPlaying = false;
        let demoTimeouts = [];

        const activeVoices = new Map();
        const activeKeys = new Set();

        const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const keys88 = [];

        for (let i = 0; i < 88; i++) {
            const keyNum = i + 1;
            const noteIndex = (i + 9) % 12;
            const octave = Math.floor((i + 9) / 12);
            const noteName = NOTES[noteIndex];
            const isBlack = noteName.includes('#');
            const freq = 440 * Math.pow(2, (i - 48) / 12);
            keys88.push({ keyNum, noteName, octave, isBlack, freq, fullName: `${noteName}${octave}` });
        }

        const keyMapWhite = ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', "'"];
        const keyMapBlack = ['w', 'e', 't', 'y', 'u', 'o', 'p'];
        const drumKeys = ['z', 'x', 'c', 'v', 'b', 'n', 'm'];

        const DRUM_PARAMS = [
            { rate: 8.0, duration: 0.12, gain: 1.0 },
            { rate: 12.0, duration: 0.15, gain: 0.9 },
            { rate: 24.0, duration: 0.05, gain: 0.7 },
            { rate: 18.0, duration: 0.25, gain: 0.7 },
            { rate: 9.5, duration: 0.18, gain: 0.9 },
            { rate: 14.0, duration: 0.15, gain: 0.9 },
            { rate: 20.0, duration: 0.40, gain: 0.8 }
        ];

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.75;
            masterGain.connect(audioCtx.destination);

            loadBuffers();
        }

        function createSynthBuffer(ctx, freq, duration, mode) {
            const sampleRate = ctx.sampleRate;
            const buffer = ctx.createBuffer(1, sampleRate * duration, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                const t = i / sampleRate;
                const phase = (t * freq) % 1;
                if (mode === 'bass') {
                    const tri = phase < 0.5 ? (4 * phase - 1) : (3 - 4 * phase);
                    const sq = phase < 0.5 ? 1 : -1;
                    data[i] = (tri * 0.7 + sq * 0.3) * 0.8;
                } else if (mode === 'pulse') {
                    data[i] = (phase < 0.25 ? 1 : -1) * 0.7;
                } else {
                    data[i] = (Math.random() * 2 - 1) * 0.8;
                }
            }
            return buffer;
        }

        async function loadBuffers() {
            try {
                let r1 = await fetch('bass_tone.wav');
                if (!r1.ok) r1 = await fetch('bass.wav');
                if (r1.ok) {
                    const ab1 = await r1.arrayBuffer();
                    bassBuffer = await audioCtx.decodeAudioData(ab1);
                } else {
                    bassBuffer = createSynthBuffer(audioCtx, BASE_FREQ_BASS, 2.0, 'bass');
                }
            } catch (e) {
                bassBuffer = createSynthBuffer(audioCtx, BASE_FREQ_BASS, 2.0, 'bass');
            }

            try {
                const r2 = await fetch('mane_pulse.wav');
                if (r2.ok) {
                    const ab2 = await r2.arrayBuffer();
                    pulseBuffer = await audioCtx.decodeAudioData(ab2);
                } else {
                    pulseBuffer = createSynthBuffer(audioCtx, BASE_FREQ_PULSE, 1.0, 'pulse');
                }
            } catch (e) {
                pulseBuffer = createSynthBuffer(audioCtx, BASE_FREQ_PULSE, 1.0, 'pulse');
            }

            try {
                const r3 = await fetch('drum.wav');
                if (r3.ok) {
                    const ab3 = await r3.arrayBuffer();
                    drumBuffer = await audioCtx.decodeAudioData(ab3);
                } else {
                    drumBuffer = createSynthBuffer(audioCtx, 100, 2.0, 'noise');
                }
            } catch (e) {
                drumBuffer = createSynthBuffer(audioCtx, 100, 2.0, 'noise');
            }
        }

        function playNote(keyObj, modeOverride = null) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const mode = modeOverride || currentToneMode;
            const voiceKey = `${keyObj.keyNum}_${mode}`;

            if (activeVoices.has(voiceKey)) stopNote(keyObj.keyNum, mode);

            const isBass = mode === 'bass';
            const buf = isBass ? bassBuffer : pulseBuffer;
            const baseFreq = isBass ? BASE_FREQ_BASS : BASE_FREQ_PULSE;

            if (!buf || !audioCtx) return;

            try {
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                src.loop = true;

                const rate = Math.max(0.01, keyObj.freq / baseFreq);
                src.playbackRate.setValueAtTime(rate, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                gain.gain.setValueAtTime(0.001, now);
                if (isBass) {
                    gain.gain.linearRampToValueAtTime(0.8, now + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.4, now + 0.25);
                } else {
                    gain.gain.linearRampToValueAtTime(0.6, now + 0.005);
                    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.15);
                }

                src.connect(gain);
                gain.connect(masterGain);
                src.start(now);

                activeVoices.set(voiceKey, { src, gain });
                highlightKey(keyObj.keyNum, true);
            } catch (e) {}
        }

        function stopNote(keyNum, modeOverride = null) {
            const mode = modeOverride || currentToneMode;
            const voiceKey = `${keyNum}_${mode}`;
            const voice = activeVoices.get(voiceKey);

            if (voice && audioCtx) {
                try {
                    const now = audioCtx.currentTime;
                    voice.gain.gain.cancelScheduledValues(now);
                    voice.gain.gain.setValueAtTime(voice.gain.gain.value, now);
                    voice.gain.gain.linearRampToValueAtTime(0.0001, now + 0.08);
                    voice.src.stop(now + 0.09);
                } catch (e) {}
                activeVoices.delete(voiceKey);
            }
            highlightKey(keyNum, false);
        }

        function playDrum(index) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!drumBuffer || !audioCtx) return;

            const param = DRUM_PARAMS[index] || DRUM_PARAMS[0];
            try {
                const src = audioCtx.createBufferSource();
                src.buffer = drumBuffer;
                src.playbackRate.setValueAtTime(param.rate, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                gain.gain.setValueAtTime(param.gain, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + param.duration);

                src.connect(gain);
                gain.connect(masterGain);
                src.start(now);
                src.stop(now + param.duration + 0.05);

                highlightDrum(index);
            } catch (e) {}
        }

        function highlightDrum(index) {
            const pad = document.querySelector(`[data-drum="${index}"]`);
            if (pad) {
                pad.classList.add('active');
                setTimeout(() => pad.classList.remove('active'), 120);
            }
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';

            let whiteOffset = 0;
            const whiteWidth = 32;

            keys88.forEach((k) => {
                const el = document.createElement('div');
                if (!k.isBlack) {
                    el.className = 'key-white absolute top-0 h-full cursor-pointer flex flex-col justify-end items-center pb-2 text-[8px] text-slate-800 font-bold';
                    el.style.width = `${whiteWidth}px`;
                    el.style.left = `${whiteOffset * whiteWidth}px`;
                    el.dataset.keyNum = k.keyNum;
                    el.innerHTML = `<span>${k.noteName}</span><span class="text-[7px] text-slate-500">${k.octave}</span>`;
                    whiteOffset++;
                } else {
                    el.className = 'key-black absolute top-0 h-28 cursor-pointer flex flex-col justify-end items-center pb-2 text-[7px] text-slate-200 font-bold';
                    el.style.width = `${whiteWidth * 0.65}px`;
                    el.style.left = `${(whiteOffset - 1) * whiteWidth + (whiteWidth * 0.68)}px`;
                    el.dataset.keyNum = k.keyNum;
                    el.innerHTML = `<span>${k.noteName}</span>`;
                }

                el.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    playNote(k);
                });
                el.addEventListener('mouseup', () => stopNote(k.keyNum));
                el.addEventListener('mouseleave', () => stopNote(k.keyNum));

                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    playNote(k);
                });
                el.addEventListener('touchend', () => stopNote(k.keyNum));

                kb.appendChild(el);
            });
        }

        function highlightKey(keyNum, active) {
            const el = document.querySelector(`[data-key-num="${keyNum}"]`);
            if (el) {
                if (active) el.classList.add('active');
                else el.classList.remove('active');
            }
        }

        function updateOctaveDisplay() {
            document.getElementById('octave-display').innerText = currentOctave;
            document.getElementById('map-octave').innerText = currentOctave;
        }

        function scrollCurrentOctaveIntoView() {
            const firstKeyOfOctave = keys88.find(k => k.octave === currentOctave && k.noteName === 'C');
            if (firstKeyOfOctave) {
                const el = document.querySelector(`[data-key-num="${firstKeyOfOctave.keyNum}"]`);
                if (el) {
                    const scrollContainer = document.getElementById('piano-scroll');
                    scrollContainer.scrollTo({
                        left: el.offsetLeft - 100,
                        behavior: 'smooth'
                    });
                }
            }
        }

        const DEMO_SONGS = {
            star: {
                bpm: 110,
                melody: [
                    ["C4", 1], ["C4", 1], ["G4", 1], ["G4", 1], ["A4", 1], ["A4", 1], ["G4", 2],
                    ["F4", 1], ["F4", 1], ["E4", 1], ["E4", 1], ["D4", 1], ["D4", 1], ["C4", 2],
                    ["G4", 1], ["G4", 1], ["F4", 1], ["F4", 1], ["E4", 1], ["E4", 1], ["D4", 2],
                    ["G4", 1], ["G4", 1], ["F4", 1], ["F4", 1], ["E4", 1], ["E4", 1], ["D4", 2],
                    ["C4", 1], ["C4", 1], ["G4", 1], ["G4", 1], ["A4", 1], ["A4", 1], ["G4", 2],
                    ["F4", 1], ["F4", 1], ["E4", 1], ["E4", 1], ["D4", 1], ["D4", 1], ["C4", 2]
                ],
                bass: [
                    ["C2", 2], ["E2", 2], ["F2", 2], ["C2", 2],
                    ["F2", 2], ["C2", 2], ["G2", 2], ["C2", 2],
                    ["C2", 2], ["B1", 2], ["A1", 2], ["G1", 2],
                    ["C2", 2], ["B1", 2], ["A1", 2], ["G1", 2],
                    ["C2", 2], ["E2", 2], ["F2", 2], ["C2", 2],
                    ["F2", 2], ["C2", 2], ["G2", 2], ["C2", 2]
                ]
            },
            airplane: {
                bpm: 130,
                melody: [
                    ["E4", 1.5], ["D4", 0.5], ["C4", 1], ["D4", 1], ["E4", 1], ["E4", 1], ["E4", 2],
                    ["D4", 1], ["D4", 1], ["D4", 2], ["E4", 1], ["G4", 1], ["G4", 2],
                    ["E4", 1.5], ["D4", 0.5], ["C4", 1], ["D4", 1], ["E4", 1], ["E4", 1], ["E4", 1], ["E4", 1],
                    ["D4", 1], ["D4", 1], ["E4", 1], ["D4", 1], ["C4", 3]
                ],
                bass: [
                    ["C2", 2], ["C2", 2], ["C2", 2], ["C2", 2],
                    ["G1", 2], ["G1", 2], ["C2", 2], ["C2", 2],
                    ["C2", 2], ["C2", 2], ["C2", 2], ["C2", 2],
                    ["G1", 2], ["G1", 2], ["C2", 3]
                ]
            },
            elise: {
                bpm: 140,
                melody: [
                    ["E5", 0.5], ["D#5", 0.5], ["E5", 0.5], ["D#5", 0.5], ["E5", 0.5], ["B4", 0.5], ["D5", 0.5], ["C5", 0.5], ["A4", 1],
                    ["C4", 0.5], ["E4", 0.5], ["A4", 0.5], ["B4", 1], ["E4", 0.5], ["G#4", 0.5], ["B4", 0.5], ["C5", 1],
                    ["E5", 0.5], ["D#5", 0.5], ["E5", 0.5], ["D#5", 0.5], ["E5", 0.5], ["B4", 0.5], ["D5", 0.5], ["C5", 0.5], ["A4", 1]
                ],
                bass: [
                    ["A1", 2], ["A1", 2], ["A1", 2],
                    ["A1", 2], ["E1", 2], ["A1", 2],
                    ["A1", 2], ["A1", 2], ["A1", 2]
                ]
            }
        };

        function playDemo() {
            stopDemo();
            initAudio();
            isDemoPlaying = true;

            document.getElementById('play-demo-btn').classList.add('hidden');
            document.getElementById('stop-demo-btn').classList.remove('hidden');

            const songKey = document.getElementById('song-select').value;
            const song = DEMO_SONGS[songKey];
            const beatMs = (60 / song.bpm) * 1000;

            let currentTime = 0;
            song.melody.forEach(([note, duration]) => {
                const k = keys88.find(x => x.fullName === note);
                if (k) {
                    const t1 = setTimeout(() => {
                        if (isDemoPlaying) playNote(k, 'pulse');
                    }, currentTime);
                    const t2 = setTimeout(() => {
                        if (isDemoPlaying) stopNote(k.keyNum, 'pulse');
                    }, currentTime + (duration * beatMs * 0.85));
                    demoTimeouts.push(t1, t2);
                }
                currentTime += duration * beatMs;
            });

            let bassTime = 0;
            song.bass.forEach(([note, duration]) => {
                const k = keys88.find(x => x.fullName === note);
                if (k) {
                    const t1 = setTimeout(() => {
                        if (isDemoPlaying) playNote(k, 'bass');
                    }, bassTime);
                    const t2 = setTimeout(() => {
                        if (isDemoPlaying) stopNote(k.keyNum, 'bass');
                    }, bassTime + (duration * beatMs * 0.9));
                    demoTimeouts.push(t1, t2);
                }
                bassTime += duration * beatMs;
            });

            const endTimeout = setTimeout(() => {
                stopDemo();
            }, Math.max(currentTime, bassTime) + 500);
            demoTimeouts.push(endTimeout);
        }

        function stopDemo() {
            isDemoPlaying = false;
            demoTimeouts.forEach(clearTimeout);
            demoTimeouts = [];

            keys88.forEach(k => {
                stopNote(k.keyNum, 'bass');
                stopNote(k.keyNum, 'pulse');
            });

            document.getElementById('play-demo-btn').classList.remove('hidden');
            document.getElementById('stop-demo-btn').classList.add('hidden');
        }

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const length = buffer.length;
            const dataByteLength = length * blockAlign;
            const headerByteLength = 44;
            const totalByteLength = headerByteLength + dataByteLength;

            const arrayBuffer = new ArrayBuffer(totalByteLength);
            const view = new DataView(arrayBuffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataByteLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataByteLength, true);

            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    let sample = buffer.getChannelData(channel)[i];
                    sample = Math.max(-1, Math.min(1, sample));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
            }
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function toggleRecording() {
            initAudio();
            if (!isRecording) {
                recordedBuffersLeft = [];
                recordedBuffersRight = [];

                recorderNode = audioCtx.createScriptProcessor(4096, 2, 2);
                recorderNode.onaudioprocess = (e) => {
                    if (!isRecording) return;
                    const left = e.inputBuffer.getChannelData(0);
                    const right = e.inputBuffer.getChannelData(1);
                    recordedBuffersLeft.push(new Float32Array(left));
                    recordedBuffersRight.push(new Float32Array(right));
                };

                masterGain.connect(recorderNode);
                recorderNode.connect(audioCtx.destination);

                isRecording = true;
                document.getElementById('rec-btn').classList.replace('bg-red-600', 'bg-amber-600');
                document.getElementById('rec-text').innerText = 'STOP (WAV)';
                document.getElementById('rec-dot').classList.add('animate-ping');
            } else {
                isRecording = false;
                if (recorderNode) {
                    masterGain.disconnect(recorderNode);
                    recorderNode.disconnect();
                }

                document.getElementById('rec-btn').classList.replace('bg-amber-600', 'bg-red-600');
                document.getElementById('rec-text').innerText = 'REC (WAV)';
                document.getElementById('rec-dot').classList.remove('animate-ping');

                const totalSamples = recordedBuffersLeft.reduce((acc, curr) => acc + curr.length, 0);
                if (totalSamples > 0) {
                    const recordedBuffer = audioCtx.createBuffer(2, totalSamples, audioCtx.sampleRate);
                    const leftChan = recordedBuffer.getChannelData(0);
                    const rightChan = recordedBuffer.getChannelData(1);
                    let offset = 0;
                    for (let i = 0; i < recordedBuffersLeft.length; i++) {
                        leftChan.set(recordedBuffersLeft[i], offset);
                        rightChan.set(recordedBuffersRight[i], offset);
                        offset += recordedBuffersLeft[i].length;
                    }

                    const wavBlob = audioBufferToWav(recordedBuffer);
                    const url = URL.createObjectURL(wavBlob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `8bit_piano_drum_record_${Date.now()}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                }
            }
        }

        function getNoteFromKeyboardKey(key) {
            const whiteIndex = keyMapWhite.indexOf(key.toLowerCase());
            if (whiteIndex !== -1) {
                const octaveKeys = keys88.filter(k => k.octave === currentOctave && !k.isBlack);
                return octaveKeys[whiteIndex] || null;
            }

            const blackIndex = keyMapBlack.indexOf(key.toLowerCase());
            if (blackIndex !== -1) {
                const octaveKeys = keys88.filter(k => k.octave === currentOctave && k.isBlack);
                return octaveKeys[blackIndex] || null;
            }

            return null;
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;

            if (e.key === 'ArrowLeft') {
                currentOctave = Math.max(0, currentOctave - 1);
                updateOctaveDisplay();
                scrollCurrentOctaveIntoView();
                return;
            }
            if (e.key === 'ArrowRight') {
                currentOctave = Math.min(8, currentOctave + 1);
                updateOctaveDisplay();
                scrollCurrentOctaveIntoView();
                return;
            }

            const drumIndex = drumKeys.indexOf(e.key.toLowerCase());
            if (drumIndex !== -1) {
                playDrum(drumIndex);
                return;
            }

            const noteKey = getNoteFromKeyboardKey(e.key);
            if (noteKey && !activeKeys.has(e.key)) {
                activeKeys.add(e.key);
                playNote(noteKey);
            }
        });

        window.addEventListener('keyup', (e) => {
            const noteKey = getNoteFromKeyboardKey(e.key);
            if (noteKey) {
                activeKeys.delete(e.key);
                stopNote(noteKey.keyNum);
            }
        });

        document.querySelectorAll('.drum-pad').forEach(pad => {
            const index = parseInt(pad.dataset.drum, 10);
            pad.addEventListener('mousedown', (e) => {
                e.preventDefault();
                playDrum(index);
            });
            pad.addEventListener('touchstart', (e) => {
                e.preventDefault();
                playDrum(index);
            });
        });

        document.getElementById('tone-select').addEventListener('change', (e) => {
            currentToneMode = e.target.value;
        });

        document.getElementById('octave-down').addEventListener('click', () => {
            currentOctave = Math.max(0, currentOctave - 1);
            updateOctaveDisplay();
            scrollCurrentOctaveIntoView();
        });

        document.getElementById('octave-up').addEventListener('click', () => {
            currentOctave = Math.min(8, currentOctave + 1);
            updateOctaveDisplay();
            scrollCurrentOctaveIntoView();
        });

        document.getElementById('play-demo-btn').addEventListener('click', playDemo);
        document.getElementById('stop-demo-btn').addEventListener('click', stopDemo);
        document.getElementById('rec-btn').addEventListener('click', toggleRecording);

        window.addEventListener('DOMContentLoaded', () => {
            renderKeyboard();
            updateOctaveDisplay();
            setTimeout(scrollCurrentOctaveIntoView, 200);
        });
    </script>
</body>
</html>
