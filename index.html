<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8Bit Piano & Drum Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { font-family: 'Press Start 2P', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .key-white { background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%); border: 2px solid #0f172a; border-radius: 0 0 6px 6px; box-shadow: 0 4px 0 #0f172a; }
        .key-white:active, .key-white.active { background: #38bdf8; transform: translateY(2px); box-shadow: 0 2px 0 #0f172a; }
        .key-black { background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%); border: 2px solid #000000; border-radius: 0 0 4px 4px; box-shadow: 0 3px 0 #000000; z-index: 10; }
        .key-black:active, .key-black.active { background: #f43f5e; transform: translateY(2px); box-shadow: 0 1px 0 #000000; }
        .drum-pad { transition: all 0.05s ease; }
        .drum-pad:active, .drum-pad.active { transform: scale(0.95); filter: brightness(1.3); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none overflow-x-hidden">
    <header class="p-4 bg-slate-900 border-b-4 border-slate-800 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-cyan-500 rounded flex items-center justify-center text-slate-950 font-bold text-xl shadow-[2px_2px_0_#000]">8</div>
            <h1 class="text-xs md:text-sm text-cyan-400 tracking-wider">8BIT PIANO & DRUM STUDIO</h1>
        </div>

        <div class="flex flex-wrap items-center gap-3 text-[10px]">
            <div id="midi-status-btn" class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-700 transition-all">
                <span id="midi-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span id="midi-text" class="text-slate-300">MIDI: READY</span>
            </div>

            <div class="flex items-center gap-2 bg-slate-800 p-1.5 rounded border border-slate-700">
                <span class="text-slate-400 text-[9px]">음색:</span>
                <select id="tone-select" class="bg-slate-900 border border-slate-700 text-[10px] py-1 px-2 rounded text-amber-400 font-bold focus:outline-none cursor-pointer">
                    <option value="bass">묵직한 베이스</option>
                    <option value="pulse">통통 튀는 펄스 전자음</option>
                    <option value="retro">옛날게임 소리</option>
                    <option value="retro2">옛날게임 소리 2</option>
                </select>
            </div>

            <div class="flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
                <span class="text-slate-400">OCTAVE:</span>
                <button id="octave-down" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-cyan-400">◀</button>
                <span id="octave-display" class="px-2 font-bold text-amber-400">4</span>
                <button id="octave-up" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-cyan-400">▶</button>
            </div>

            <div class="flex items-center gap-2">
                <button id="rec-btn" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 rounded font-bold flex items-center gap-2 transition-all">
                    <span id="rec-dot" class="w-2.5 h-2.5 rounded-full bg-white"></span>
                    <span id="rec-text">REC (WAV)</span>

    <main class="flex-1 flex flex-col justify-center items-center p-4 gap-4 max-w-7xl mx-auto w-full">
        <div class="w-full bg-slate-900/80 p-3 rounded-xl border-2 border-slate-800 flex flex-wrap items-center justify-between gap-4">

            <div class="flex flex-wrap justify-center gap-2 text-[9px] text-slate-300">
                <span class="bg-slate-800 px-2 py-1 rounded border border-slate-700"><b class="text-amber-400">WHITE:</b> A S D F G H J K L ; '</span>
                <span class="bg-slate-800 px-2 py-1 rounded border border-slate-700"><b class="text-rose-400">BLACK:</b> W E T Y U O P</span>
                <span class="bg-slate-800 px-2 py-1 rounded border border-slate-700"><b class="text-cyan-400">OCTAVE:</b> ◀ / ▶</span>

        <div class="w-full relative bg-slate-900 p-3 rounded-2xl border-4 border-slate-800 shadow-2xl">

        <div class="w-full bg-slate-900 p-4 rounded-2xl border-4 border-slate-800 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <span class="text-[10px] text-amber-400 font-bold">8BIT DRUM PADS</span>
                <span class="text-[9px] text-slate-400">KEYS: Z X C V B N M</span>
            </div>
            <div id="drum-container" class="grid grid-cols-7 gap-2 md:gap-3">
                <button data-drum="0" class="drum-pad bg-red-950 border-2 border-red-600 hover:bg-red-900 p-3 rounded-xl flex flex-col items-center justify-center gap-1">
                    <span class="text-[11px] font-bold text-red-400">KICK</span>
                    <span class="text-[9px] bg-red-900/80 px-2 py-0.5 rounded text-white">Z</span>
                </button>
                <button data-drum="1" class="drum-pad bg-amber-950 border-2 border-amber-600 hover:bg-amber-900 p-3 rounded-xl flex flex-col items-center justify-center gap-1">
                    <span class="text-[11px] font-bold text-amber-400">SNARE</span>
                    <span class="text-[9px] bg-amber-900/80 px-2 py-0.5 rounded text-white">X</span>
                </button>
                <button data-drum="2" class="drum-pad bg-yellow-950 border-2 border-yellow-600 hover:bg-yellow-900 p-3 rounded-xl flex flex-col items-center justify-center gap-1">
                    <span class="text-[11px] font-bold text-yellow-400">CLOSED HH</span>
                    <span class="text-[9px] bg-yellow-900/80 px-2 py-0.5 rounded text-white">C</span>
                </button>
                <button data-drum="3" class="drum-pad bg-emerald-950 border-2 border-emerald-600 hover:bg-emerald-900 p-3 rounded-xl flex flex-col items-center justify-center gap-1">
                    <span class="text-[11px] font-bold text-emerald-400">OPEN HH</span>
                    <span class="text-[9px] bg-emerald-900/80 px-2 py-0.5 rounded text-white">V</span>
                </button>
                <button data-drum="4" class="drum-pad bg-cyan-950 border-2 border-cyan-600 hover:bg-cyan-900 p-3 rounded-xl flex flex-col items-center justify-center gap-1">
                    <span class="text-[11px] font-bold text-cyan-400">LOW TOM</span>
                    <span class="text-[9px] bg-cyan-900/80 px-2 py-0.5 rounded text-white">B</span>
                </button>
                <button data-drum="5" class="drum-pad bg-blue-950 border-2 border-blue-600 hover:bg-blue-900 p-3 rounded-xl flex flex-col items-center justify-center gap-1">
                    <span class="text-[11px] font-bold text-blue-400">HI TOM</span>
                    <span class="text-[9px] bg-blue-900/80 px-2 py-0.5 rounded text-white">N</span>
                </button>
                <button data-drum="6" class="drum-pad bg-purple-950 border-2 border-purple-600 hover:bg-purple-900 p-3 rounded-xl flex flex-col items-center justify-center gap-1">
                    <span class="text-[11px] font-bold text-purple-400">CRASH</span>
                    <span class="text-[9px] bg-purple-900/80 px-2 py-0.5 rounded text-white">M</span>

    </main>

    <footer class="p-3 bg-slate-900 border-t border-slate-800 text-center text-[9px] text-slate-500">
        copyright 2026 rice jamjam studio.
    </footer>

    <script>
        let audioCtx = null;
        let masterGain = null;
        let recorderNode = null;
        let recordedChunksL = [];
        let recordedChunksR = [];
        let isRecording = false;

        let bassBuffer = null;
        let pulseBuffer = null;
        let retroBuffer = null;
        let retro2Buffer = null;
        let drumBuffer = null;

        let currentToneMode = 'bass';
        let currentOctave = 4;
        let isDemoPlaying = false;
        let demoTimeouts = [];

        let midiAccess = null;

        const activeVoices = new Map();
        const activeKeys = new Set();

        const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const keys88 = [];

        for (let i = 0; i < 88; i++) {
            const keyNum = i + 1;
            const noteIndex = (i + 9) % 12;
            const octave = Math.floor((i + 9) / 12);
            const noteName = NOTES[noteIndex];
            const isBlack = noteName.includes('#');
            const freq = 440 * Math.pow(2, (i - 48) / 12);
            keys88.push({ keyNum, noteName, octave, isBlack, freq, fullName: `${noteName}${octave}` });
        }

        const keyMapWhite = ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', "'"];
        const keyMapBlack = ['w', 'e', 't', 'y', 'u', 'o', 'p'];
        const drumKeys = ['z', 'x', 'c', 'v', 'b', 'n', 'm'];

        const DRUM_PARAMS = [
            { rate: 8.0, duration: 0.12, gain: 1.0 },
            { rate: 12.0, duration: 0.15, gain: 0.9 },
            { rate: 24.0, duration: 0.05, gain: 0.7 },
            { rate: 18.0, duration: 0.25, gain: 0.7 },
            { rate: 9.5, duration: 0.18, gain: 0.9 },
            { rate: 14.0, duration: 0.15, gain: 0.9 },
            { rate: 20.0, duration: 0.40, gain: 0.8 }
        ];

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.75;
            masterGain.connect(audioCtx.destination);

            loadBuffers();
            initMIDI();
        }

        function initMIDI() {
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
            } else {
                updateMIDIStatus('unsupported');
            }
        }

        function onMIDISuccess(midi) {
            midiAccess = midi;
            let inputs = midiAccess.inputs.values();
            for (let input of inputs) {
                input.onmidimessage = handleMIDIMessage;
            }

            midiAccess.onstatechange = (e) => {
                if (e.port.type === 'input') {
                    if (e.port.state === 'connected') {
                        e.port.onmidimessage = handleMIDIMessage;
                    }
                    refreshMIDIDevices();
                }
            };

            refreshMIDIDevices();
        }

        function onMIDIFailure() {
            updateMIDIStatus('denied');
        }

        function refreshMIDIDevices() {
            if (!midiAccess) return;
            let inputs = Array.from(midiAccess.inputs.values());
            if (inputs.length > 0) {
                updateMIDIStatus('connected', inputs[0].name);
            } else {
                updateMIDIStatus('ready');
            }
        }

        function updateMIDIStatus(status, deviceName = '') {
            const dot = document.getElementById('midi-dot');
            const text = document.getElementById('midi-text');

            if (status === 'connected') {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
                text.innerText = `MIDI: ${deviceName.length > 12 ? deviceName.substring(0, 10) + '..' : deviceName}`;
                text.className = 'text-emerald-400 font-bold';
            } else if (status === 'denied') {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                text.innerText = 'MIDI: DENIED';
                text.className = 'text-rose-400';
            } else if (status === 'unsupported') {
                dot.className = 'w-2 h-2 rounded-full bg-slate-600';
                text.innerText = 'MIDI: N/A';
                text.className = 'text-slate-500';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400';
                text.innerText = 'MIDI: READY';
                text.className = 'text-amber-400';
            }
        }

        function handleMIDIMessage(event) {
            const [status, note, velocity] = event.data;
            const command = status >> 4;

            if (command === 9 && velocity > 0) {
                const keyIndex = note - 21;
                if (keyIndex >= 0 && keyIndex < 88) {
                    playNote(keys88[keyIndex]);
                }
            } else if (command === 8 || (command === 9 && velocity === 0)) {
                const keyIndex = note - 21;
                if (keyIndex >= 0 && keyIndex < 88) {
                    stopNote(keys88[keyIndex].keyNum);
                }
            }
        }

        async function loadBuffers() {
            const fetchAndDecode = async (url) => {
                try {
                    const res = await fetch(url);
                    if (!res.ok) return null;
                    const ab = await res.arrayBuffer();
                    return await audioCtx.decodeAudioData(ab);
                } catch (e) {
                    return null;
                }
            };

            bassBuffer = await fetchAndDecode('bass_tone.wav') || await fetchAndDecode('bass.wav');
            pulseBuffer = await fetchAndDecode('mane_pulse.wav') || await fetchAndDecode('pulse.wav');
            retroBuffer = await fetchAndDecode('pulse_25%.wav') || await fetchAndDecode('retro.wav');
            retro2Buffer = await fetchAndDecode('pulse_50%.wav') || await fetchAndDecode('retro2.wav');
            drumBuffer = await fetchAndDecode('drum.wav');
        }

        function playNote(keyObj, modeOverride = null) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const mode = modeOverride || currentToneMode;
            const voiceKey = `${keyObj.keyNum}_${mode}`;

            if (activeVoices.has(voiceKey)) stopNote(keyObj.keyNum, mode);

            let buf = null;
            let baseFreq = 12.5;

            if (mode === 'bass') {
                buf = bassBuffer;
                baseFreq = 12.5;
            } else if (mode === 'pulse') {
                buf = pulseBuffer;
                baseFreq = 26.0;
            } else if (mode === 'retro') {
                buf = retroBuffer;
                baseFreq = 12.0;
            } else if (mode === 'retro2') {
                buf = retro2Buffer;
                baseFreq = 80.0;
            }

            if (!audioCtx) return;

            if (!buf) {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const now = audioCtx.currentTime;

                    if (mode === 'bass') {
                        osc.type = 'sawtooth';
                    } else {
                        osc.type = 'square';
                    }

                    osc.frequency.setValueAtTime(keyObj.freq, now);

                    gain.gain.setValueAtTime(0.001, now);
                    if (mode === 'bass') {
                        gain.gain.linearRampToValueAtTime(0.4, now + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.12, now + 0.3);
                    } else {
                        gain.gain.linearRampToValueAtTime(0.35, now + 0.005);
                        gain.gain.exponentialRampToValueAtTime(0.1, now + 0.25);
                    }

                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(now);

                    activeVoices.set(voiceKey, { osc, gain, isOsc: true });
                    highlightKey(keyObj.keyNum, true);
                } catch (e) {}
                return;
            }

            try {
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                src.loop = true;

                const rate = Math.max(0.01, keyObj.freq / baseFreq);
                src.playbackRate.setValueAtTime(rate, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                gain.gain.setValueAtTime(0.001, now);
                if (mode === 'bass') {
                    gain.gain.linearRampToValueAtTime(0.7, now + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.25);
                } else {
                    gain.gain.linearRampToValueAtTime(0.5, now + 0.005);
                    gain.gain.exponentialRampToValueAtTime(0.2, now + 0.2);
                }

                src.connect(gain);
                gain.connect(masterGain);
                src.start(now);

                activeVoices.set(voiceKey, { src, gain, isOsc: false });
                highlightKey(keyObj.keyNum, true);
            } catch (e) {}
        }

        function stopNote(keyNum, modeOverride = null) {
            const mode = modeOverride || currentToneMode;
            const voiceKey = `${keyNum}_${mode}`;
            const voice = activeVoices.get(voiceKey);

            if (voice && audioCtx) {
                try {
                    const now = audioCtx.currentTime;
                    voice.gain.gain.cancelScheduledValues(now);
                    voice.gain.gain.setValueAtTime(voice.gain.gain.value, now);
                    voice.gain.gain.linearRampToValueAtTime(0.0001, now + 0.08);
                    
                    if (voice.isOsc) {
                        voice.osc.stop(now + 0.09);
                    } else {
                        voice.src.stop(now + 0.09);
                    }
                } catch (e) {}
                activeVoices.delete(voiceKey);
            }
            highlightKey(keyNum, false);
        }

        function playDrum(index) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!audioCtx) return;

            if (drumBuffer) {
                const param = DRUM_PARAMS[index] || DRUM_PARAMS[0];
                try {
                    const src = audioCtx.createBufferSource();
                    src.buffer = drumBuffer;
                    src.playbackRate.setValueAtTime(param.rate, audioCtx.currentTime);

                    const gain = audioCtx.createGain();
                    const now = audioCtx.currentTime;

                    gain.gain.setValueAtTime(param.gain, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + param.duration);

                    src.connect(gain);
                    gain.connect(masterGain);
                    src.start(now);
                    src.stop(now + param.duration + 0.05);

                    highlightDrum(index);
                } catch (e) {}
            } else {
                try {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    if (index === 0) {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(120, now);
                        osc.frequency.exponentialRampToValueAtTime(20, now + 0.12);
                        gain.gain.setValueAtTime(1.0, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    } else if (index === 1) {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(240, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.14);
                        gain.gain.setValueAtTime(0.7, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    } else {
                        const freqs = [800, 1200, 160, 280, 1400];
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freqs[index - 2] || 600, now);
                        gain.gain.setValueAtTime(0.5, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    }

                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start(now);
                    osc.stop(now + 0.15);

                    highlightDrum(index);
                } catch (e) {}
            }
        }

        function highlightDrum(index) {
            const pad = document.querySelector(`[data-drum="${index}"]`);
            if (pad) {
                pad.classList.add('active');
                setTimeout(() => pad.classList.remove('active'), 120);
            }
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';

            let whiteOffset = 0;
            const whiteWidth = 32;

            keys88.forEach((k) => {
                const el = document.createElement('div');
                if (!k.isBlack) {
                    el.className = 'key-white absolute top-0 h-full cursor-pointer flex flex-col justify-end items-center pb-2 text-[8px] text-slate-800 font-bold';
                    el.style.width = `${whiteWidth}px`;
                    el.style.left = `${whiteOffset * whiteWidth}px`;
                    el.dataset.keyNum = k.keyNum;
                    el.innerHTML = `<span>${k.noteName}</span><span class="text-[7px] text-slate-500">${k.octave}</span>`;
                    whiteOffset++;
                } else {
                    el.className = 'key-black absolute top-0 h-28 cursor-pointer flex flex-col justify-end items-center pb-2 text-[7px] text-slate-200 font-bold';
                    el.style.width = `${whiteWidth * 0.65}px`;
                    el.style.left = `${(whiteOffset - 1) * whiteWidth + (whiteWidth * 0.68)}px`;
                    el.dataset.keyNum = k.keyNum;
                    el.innerHTML = `<span>${k.noteName}</span>`;
                }

                el.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    playNote(k);
                });
                el.addEventListener('mouseup', () => stopNote(k.keyNum));
                el.addEventListener('mouseleave', () => stopNote(k.keyNum));

                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    playNote(k);
                });
                el.addEventListener('touchend', () => stopNote(k.keyNum));

                kb.appendChild(el);
            });
        }

        function highlightKey(keyNum, active) {
            const el = document.querySelector(`[data-key-num="${keyNum}"]`);
            if (el) {
                if (active) el.classList.add('active');
                else el.classList.remove('active');
            }
        }

        function updateOctaveDisplay() {
            document.getElementById('octave-display').innerText = currentOctave;
            document.getElementById('map-octave').innerText = currentOctave;
        }

        function scrollCurrentOctaveIntoView() {
            const firstKeyOfOctave = keys88.find(k => k.octave === currentOctave && k.noteName === 'C');
            if (firstKeyOfOctave) {
                const el = document.querySelector(`[data-key-num="${firstKeyOfOctave.keyNum}"]`);
                if (el) {
                    const scrollContainer = document.getElementById('piano-scroll');
                    scrollContainer.scrollTo({
                        left: el.offsetLeft - 100,
                        behavior: 'smooth'
                    });
                }
            }
        }

        const DEMO_SONGS = {
            star: {
                bpm: 110,
                melody: [
                    ["C4", 1], ["C4", 1], ["G4", 1], ["G4", 1], ["A4", 1], ["A4", 1], ["G4", 2],

        function playDemo() {
            stopDemo();
            initAudio();
            isDemoPlaying = true;

            document.getElementById('play-demo-btn').classList.add('hidden');
            document.getElementById('stop-demo-btn').classList.remove('hidden');

            const songKey = document.getElementById('song-select').value;
            const song = DEMO_SONGS[songKey];
            const beatMs = (60 / song.bpm) * 1000;

            let currentTime = 0;
            song.melody.forEach(([note, duration]) => {
                const k = keys88.find(x => x.fullName === note);
                if (k) {
                    const t1 = setTimeout(() => {
                        if (isDemoPlaying) playNote(k, 'pulse');
                    }, currentTime);
                    const t2 = setTimeout(() => {
                        if (isDemoPlaying) stopNote(k.keyNum, 'pulse');
                    }, currentTime + (duration * beatMs * 0.85));
                    demoTimeouts.push(t1, t2);
                }
                currentTime += duration * beatMs;
            });

            let bassTime = 0;
            song.bass.forEach(([note, duration]) => {
                const k = keys88.find(x => x.fullName === note);
                if (k) {
                    const t1 = setTimeout(() => {
                        if (isDemoPlaying) playNote(k, 'bass');
                    }, bassTime);
                    const t2 = setTimeout(() => {
                        if (isDemoPlaying) stopNote(k.keyNum, 'bass');
                    }, bassTime + (duration * beatMs * 0.9));
                    demoTimeouts.push(t1, t2);
                }
                bassTime += duration * beatMs;
            });

            const endTimeout = setTimeout(() => {
                stopDemo();
            }, Math.max(currentTime, bassTime) + 500);
            demoTimeouts.push(endTimeout);
        }

        function stopDemo() {
            isDemoPlaying = false;
            demoTimeouts.forEach(clearTimeout);
            demoTimeouts = [];

            keys88.forEach(k => {
                stopNote(k.keyNum, 'bass');
                stopNote(k.keyNum, 'pulse');
                stopNote(k.keyNum, 'retro');
                stopNote(k.keyNum, 'retro2');
            });

            document.getElementById('play-demo-btn').classList.remove('hidden');
            document.getElementById('stop-demo-btn').classList.add('hidden');
        }

        function toggleRecording() {
            initAudio();
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunksL = [];
            recordedChunksR = [];

            const bufferSize = 4096;
            recorderNode = audioCtx.createScriptProcessor(bufferSize, 2, 2);

            recorderNode.onaudioprocess = (e) => {
                if (!isRecording) return;
                const left = e.inputBuffer.getChannelData(0);
                const right = e.inputBuffer.getChannelData(1);
                recordedChunksL.push(new Float32Array(left));
                recordedChunksR.push(new Float32Array(right));
            };

            masterGain.connect(recorderNode);
            recorderNode.connect(audioCtx.destination);

            isRecording = true;
            document.getElementById('rec-btn').classList.replace('bg-red-600', 'bg-amber-600');
            document.getElementById('rec-dot').classList.add('animate-ping');
            document.getElementById('rec-text').innerText = 'STOP & SAVE';
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('rec-btn').classList.replace('bg-amber-600', 'bg-red-600');
            document.getElementById('rec-dot').classList.remove('animate-ping');
            document.getElementById('rec-text').innerText = 'REC (WAV)';

            if (recorderNode) {
                recorderNode.disconnect();
                masterGain.disconnect(recorderNode);
                recorderNode = null;
            }

            exportWAV(recordedChunksL, recordedChunksR, audioCtx.sampleRate);
        }

        function exportWAV(chunksL, chunksR, sampleRate) {
            let totalLength = 0;
            for (let i = 0; i < chunksL.length; i++) totalLength += chunksL[i].length;
            if (totalLength === 0) return;

            const mergedL = new Float32Array(totalLength);
            const mergedR = new Float32Array(totalLength);
            let offset = 0;
            for (let i = 0; i < chunksL.length; i++) {
                mergedL.set(chunksL[i], offset);
                mergedR.set(chunksR[i], offset);
                offset += chunksL[i].length;
            }

            const wavBuffer = encodeWAV([mergedL, mergedR], sampleRate);
            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `8bit_studio_rec_${Date.now()}.wav`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function encodeWAV(channels, sampleRate) {
            const numChannels = channels.length;
            const length = channels[0].length;
            const buffer = new ArrayBuffer(44 + length * numChannels * 2);
            const view = new DataView(buffer);

            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * numChannels * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * numChannels * 2, true);

            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    let sample = Math.max(-1, Math.min(1, channels[ch][i]));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
            }
            return buffer;
        }

        function getWhiteKeyObj(whiteIdx, baseOctave) {
            const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const noteName = whiteNotes[whiteIdx % 7];
            const oct = baseOctave + Math.floor(whiteIdx / 7);
            return keys88.find(k => k.noteName === noteName && k.octave === oct);
        }

        function getBlackKeyObj(blackIdx, baseOctave) {
            const blackNotes = ['C#', 'D#', 'F#', 'G#', 'A#'];
            const noteName = blackNotes[blackIdx % 5];
            const oct = baseOctave + Math.floor(blackIdx / 5);
            return keys88.find(k => k.noteName === noteName && k.octave === oct);
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();

            if (e.key === 'ArrowLeft') {
                if (currentOctave > 1) {
                    currentOctave--;
                    updateOctaveDisplay();
                    scrollCurrentOctaveIntoView();
                }
                return;
            }
            if (e.key === 'ArrowRight') {
                if (currentOctave < 7) {
                    currentOctave--;
                    updateOctaveDisplay();
                    scrollCurrentOctaveIntoView();
                }
                return;
            }

            const drumIndex = drumKeys.indexOf(key);
            if (drumIndex !== -1) {
                playDrum(drumIndex);
                return;
            }

            const whiteIdx = keyMapWhite.indexOf(key);
            if (whiteIdx !== -1) {
                const target = getWhiteKeyObj(whiteIdx, currentOctave);
                if (target) {
                    activeKeys.add(key);
                    playNote(target);
                }
                return;
            }

            const blackIdx = keyMapBlack.indexOf(key);
            if (blackIdx !== -1) {
                const target = getBlackKeyObj(blackIdx, currentOctave);
                if (target) {
                    activeKeys.add(key);
                    playNote(target);
                }
                return;
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            activeKeys.delete(key);

            const whiteIdx = keyMapWhite.indexOf(key);
            if (whiteIdx !== -1) {
                const target = getWhiteKeyObj(whiteIdx, currentOctave);
                if (target) stopNote(target.keyNum);
                return;
            }

            const blackIdx = keyMapBlack.indexOf(key);
            if (blackIdx !== -1) {
                const target = getBlackKeyObj(blackIdx, currentOctave);
                if (target) stopNote(target.keyNum);
                return;
            }
        });

        window.onload = function () {
            renderKeyboard();
            updateOctaveDisplay();
            setTimeout(scrollCurrentOctaveIntoView, 200);

            document.getElementById('tone-select').addEventListener('change', (e) => {
                currentToneMode = e.target.value;
            });

            document.getElementById('octave-down').addEventListener('click', () => {
                if (currentOctave > 1) {
                    currentOctave--;
                    updateOctaveDisplay();
                    scrollCurrentOctaveIntoView();
                }
            });

            document.getElementById('octave-up').addEventListener('click', () => {
                if (currentOctave < 7) {
                    currentOctave++;
                    updateOctaveDisplay();
                    scrollCurrentOctaveIntoView();
                }
            });

            document.getElementById('play-demo-btn').addEventListener('click', playDemo);
            document.getElementById('stop-demo-btn').addEventListener('click', stopDemo);
            document.getElementById('rec-btn').addEventListener('click', toggleRecording);

            document.querySelectorAll('[data-drum]').forEach((btn) => {
                const idx = parseInt(btn.dataset.drum);
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    playDrum(idx);
                });
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    playDrum(idx);
                });
            });

            document.getElementById('midi-status-btn').addEventListener('click', () => {
                initAudio();
                initMIDI();
            });
        };
    </script>
